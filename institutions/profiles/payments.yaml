# Payments rail -- settlement for the shared-cost tail.
#
# SCOPE HONESTY: the shared-cost tail is designed and drawn, not built in the
# five days.
#
# GUARDRAIL: no money moves without an explicit human yes. This profile
# describes what the rail does AFTER a person has authorised a transfer. It
# never initiates one.

name: payments
port: 9005
sla_days: 1
accepts_services: [payment]

reject_malformed_rate: 0.03
unreachable_rate: 0.04
breach_rate: 0.02
false_closure_rate: 0.00
mean_response_hours: 0.05

calibration_note: >
  A payments rail is the one counterparty in the mesh that is genuinely
  reliable, and saying so is more useful than pretending everything is broken.
  reject_malformed_rate covers a failed VPA or a mandate limit; unreachable_rate
  covers bank downtime, which is real and briefly total. false_closure_rate is
  zero by construction: a settlement either reconciles against the ledger or it
  does not, so there is no room for the "resolved with no work done" behaviour
  that defines the civic profiles.
