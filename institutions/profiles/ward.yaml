# BBMP ward office -- Bruhat Bengaluru Mahanagara Palike, Ward 12.
#
# Two jobs in the demo. It is the correct authority for the borewell segments
# in the absorbed-village part of the ward, and it is the standing WRONG answer
# for everything on a BWSSB trunk main. A filing that lands here when it should
# have gone to BWSSB is not refused loudly -- it is accepted, sat on, and
# closed. That is how a valid complaint dies without the citizen being told.

name: ward
port: 9001
sla_days: 7
accepts_services: [water, garbage, roads, streetlight, sewage]

reject_malformed_rate: 0.12
unreachable_rate: 0.05
breach_rate: 0.55
false_closure_rate: 0.35
mean_response_hours: 48

calibration_note: >
  false_closure_rate is the highest of the institutional profiles because the
  documented reopen-reclose behaviour is a Sahaaya artefact specifically -- the
  pothole complaint opened and re-closed at least fifteen times was a BBMP
  ticket. breach_rate anchored on BBMP alone carrying 10,000+ pending Sakala
  applications against statutory day counts it publishes itself.
  accepts_services is deliberately wide: the ward office does NOT bounce a
  misrouted water complaint, which is the failure mode the grounded Remedy
  lookup exists to prevent. Reporting notes the agencies themselves "remain
  unsure as to which responsibility falls under whose jurisdiction", so a wide
  intake with a low completion rate is the honest model.
