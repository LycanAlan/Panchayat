  # -- roads, BBMP -- the demo streets only ------------------------------------
  # A carriageway is BBMP's, whichever trunk main runs under it, so these do not
  # share the water entries' feeder ids. feeder_id is the street itself: two
  # households reporting the same hole on one street are one fault, and a hole
  # on the next cross street is not -- core/scoring.py scores that adjacency at
  # 0.15, well under TAU.
  #
  # BWSSB is the standing wrong answer, most often when the hole is full of
  # water. Water standing in a pothole does not make the pothole BWSSB's.
  #
  # Streets not listed here have no roads entry on purpose. The door answers
  # 409 not_routable_here for them rather than inventing an office; adding one
  # is the same recipe, curated by hand.
  #
  # `location` is required because a pothole has no RR number: the particulars
  # a ward engineer needs are where it is, how long it has stood, and how many
  # households it reaches.

  - service: roads
    segment: ward12-4thcross
